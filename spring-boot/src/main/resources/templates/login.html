<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Spring Boot</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><main class="shell"><section class="card"><p class="eyebrow">WEB TECHNOLOGY LAB · SPRING BOOT</p><h1>Welcome back</h1><p class="sub">Sign in to continue to your workspace.</p>
<p th:if="${notice}" th:class="'notice ' + ${noticeType}" th:text="${notice}" role="status"></p>
<form action="/login" method="post"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="submit">Sign in <span aria-hidden="true">→</span></button></form><p class="foot">Demo only · Authentication not connected</p></section></main></body></html>
